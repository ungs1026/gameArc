<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIOLET TRIP | 한·일 여행 인터랙티브 포털 (무한루프 방지 적용)</title>
  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    /* ==========================================================================
       1. MULTI-COLOR PALETTE SYSTEM ANCHORED BY VIOLET (Pure Vanilla CSS)
       ========================================================================== */
    :root {
      --bg-white: #ffffff;
      --bg-canvas: #f8f7fc;
      --bg-glass: rgba(255, 255, 255, 0.90);
      --bg-dark-ink: #131129;

      /* Main Anchor: Royal Violet */
      --violet-50: #f5f3ff;
      --violet-100: #ede9fe;
      --violet-200: #ddd6fe;
      --violet-300: #c4b5fd;
      --violet-400: #a78bfa;
      --violet-500: #8b5cf6;
      --violet-600: #7c3aed;
      --violet-700: #6d28d9;
      --violet-800: #5b21b6;
      --violet-900: #3b0764;

      /* Multi-Color Accents per Category */
      --cyan-50: #ecfeff;
      --cyan-500: #06b6d4;
      --cyan-700: #0e7490;

      --amber-50: #fffbeb;
      --amber-500: #f59e0b;
      --amber-700: #b45309;

      --rose-50: #fff1f2;
      --rose-500: #f43f5e;
      --rose-700: #be123c;

      --emerald-50: #ecfdf5;
      --emerald-500: #10b981;
      --emerald-700: #047857;

      --magenta-50: #fdf2f8;
      --magenta-500: #ec4899;
      --magenta-700: #be185d;

      --indigo-600: #4f46e5;

      /* Typography & Borders */
      --text-main: #181336;
      --text-sub: #4a4568;
      --text-muted: #7e789c;
      --border-soft: #e6e1f7;
      --border-strong: #c9bdf5;

      /* Shadows & Radius */
      --shadow-sm: 0 4px 14px rgba(109, 40, 217, 0.06);
      --shadow-md: 0 12px 30px rgba(109, 40, 217, 0.11);
      --shadow-lg: 0 20px 44px rgba(76, 29, 149, 0.18);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.08) 0px, transparent 45%),
        radial-gradient(at 100% 15%, rgba(6, 182, 212, 0.08) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(244, 63, 94, 0.06) 0px, transparent 50%);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    ul, ol {
      list-style: none;
    }

    /* ==========================================================================
       2. STICKY TOP HEADER & FILE SYNC CONTROLS
       ========================================================================== */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-soft);
      box-shadow: 0 4px 20px rgba(59, 7, 100, 0.06);
    }

    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-orb {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--violet-600) 0%, var(--magenta-500) 55%, var(--cyan-500) 100%);
      color: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.25rem;
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--violet-900), var(--violet-600), var(--magenta-700));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
      display: block;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Country Switcher */
    .country-switcher {
      display: inline-flex;
      background: var(--violet-50);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
    }

    .country-btn {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-sub);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .country-btn.active[data-country="ALL"] {
      background: linear-gradient(135deg, var(--violet-600), var(--indigo-600));
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .country-btn.active[data-country="KR"] {
      background: linear-gradient(135deg, var(--violet-700), var(--rose-500));
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .country-btn.active[data-country="JP"] {
      background: linear-gradient(135deg, var(--violet-700), var(--cyan-500));
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-sub);
      background: var(--bg-white);
      border: 1px solid var(--border-soft);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--emerald-500);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .status-dot.syncing {
      background: var(--amber-500);
      animation: pulseGlow 0.9s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.9); opacity: 0.6; }
      to { transform: scale(1.3); opacity: 1; }
    }

    .btn-folder-bind {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.79rem;
      font-weight: 800;
      background: var(--cyan-50);
      color: var(--cyan-700);
      border: 1px solid rgba(6, 182, 212, 0.35);
      transition: all 0.2s ease;
    }

    .btn-folder-bind:hover {
      background: var(--cyan-500);
      color: var(--bg-white);
    }

    .btn-folder-bind.bound {
      background: var(--emerald-50);
      color: var(--emerald-700);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .btn-json-view {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      background: var(--violet-50);
      color: var(--violet-700);
      border: 1px solid var(--border-strong);
      transition: all 0.2s ease;
    }

    .btn-json-view:hover {
      background: var(--violet-100);
    }

    /* Fixed Top Refresh Button */
    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, var(--violet-600) 0%, var(--violet-800) 100%);
      color: var(--bg-white);
      font-weight: 800;
      font-size: 0.84rem;
      padding: 9px 16px;
      border-radius: 11px;
      box-shadow: 0 5px 15px rgba(109, 40, 217, 0.3);
      transition: all 0.22s ease;
    }

    .btn-refresh:hover {
      background: linear-gradient(135deg, var(--violet-700) 0%, var(--magenta-700) 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(109, 40, 217, 0.4);
    }

    .btn-refresh.loading .refresh-icon {
      display: inline-block;
      animation: spin360 0.75s linear infinite;
    }

    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Category Sub-Nav Bar */
    .category-nav-bar {
      background: var(--bg-white);
      border-top: 1px solid var(--border-soft);
    }

    .category-nav-inner {
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-nav-inner::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      padding: 12px 16px;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--text-sub);
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-tab:hover {
      color: var(--violet-700);
      background: var(--violet-50);
    }

    .nav-tab.active {
      color: var(--violet-800);
      border-bottom-color: var(--violet-600);
      background: linear-gradient(180deg, transparent, var(--violet-50));
    }

    .nav-pill {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 800;
    }

    .pill-cyan { background: var(--cyan-50); color: var(--cyan-700); }
    .pill-amber { background: var(--amber-50); color: var(--amber-700); }
    .pill-rose { background: var(--rose-50); color: var(--rose-700); }
    .pill-violet { background: var(--violet-100); color: var(--violet-800); }
    .pill-emerald { background: var(--emerald-50); color: var(--emerald-700); }
    .pill-magenta { background: var(--magenta-50); color: var(--magenta-700); }

    /* ==========================================================================
       3. MAIN CONTAINER & MULTI-COLOR HERO BANNER
       ========================================================================== */
    .main-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 28px 24px 84px;
    }

    .hero-showcase {
      background: linear-gradient(125deg, #2e1065 0%, #5b21b6 42%, #7c3aed 72%, #0891b2 100%);
      border-radius: var(--radius-lg);
      padding: 38px 42px;
      color: var(--bg-white);
      box-shadow: var(--shadow-lg);
      margin-bottom: 42px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 28px;
      align-items: center;
    }

    .hero-orb-deco {
      position: absolute;
      border-radius: 50%;
      filter: blur(45px);
      pointer-events: none;
    }

    .hero-orb-1 {
      width: 260px;
      height: 260px;
      background: rgba(244, 63, 94, 0.35);
      top: -60px;
      right: 22%;
    }

    .hero-orb-2 {
      width: 220px;
      height: 220px;
      background: rgba(6, 182, 212, 0.35);
      bottom: -70px;
      right: -30px;
    }

    .hero-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(6px);
    }

    .hero-title {
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.24;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 22px;
      max-width: 660px;
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
    }

    .hero-metric-card {
      background: rgba(19, 17, 41, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 11px 14px;
      backdrop-filter: blur(8px);
    }

    .hero-metric-card span {
      font-size: 0.71rem;
      color: rgba(255, 255, 255, 0.72);
      display: block;
    }

    .hero-metric-card strong {
      font-size: 0.94rem;
      color: #fff;
      font-weight: 800;
    }

    /* Interactive File Engine Console inside Hero */
    .hero-console {
      background: rgba(19, 17, 41, 0.86);
      border: 1px solid rgba(196, 181, 253, 0.35);
      border-radius: var(--radius-md);
      padding: 20px;
      color: #e9e5ff;
      z-index: 1;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .console-dots {
      display: flex;
      gap: 6px;
    }

    .console-dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .console-log-list {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.76rem;
      line-height: 1.55;
      color: #c4b5fd;
      max-height: 135px;
      overflow-y: auto;
    }

    .console-log-list div {
      margin-bottom: 4px;
    }

    .console-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-console {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      background: rgba(124, 58, 237, 0.35);
      color: #fff;
      border: 1px solid rgba(167, 139, 250, 0.45);
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-console:hover {
      background: var(--violet-600);
    }

    /* Section Header Common */
    .section-block {
      margin-bottom: 56px;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 22px;
      gap: 14px;
      flex-wrap: wrap;
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 900;
      padding: 4px 11px;
      border-radius: 99px;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .section-title {
      font-size: 1.48rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .btn-section-more {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 800;
      background: var(--bg-white);
      color: var(--violet-700);
      border: 1.5px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
      transition: all 0.22s ease;
    }

    .btn-section-more:hover {
      background: var(--violet-600);
      color: var(--bg-white);
      border-color: var(--violet-600);
      transform: translateX(3px);
    }

    /* ==========================================================================
       4. DESIGN PATTERN 1: ROAMING (3D Tilt Cards + Method Simulator Tabs)
       ========================================================================== */
    .roaming-simulator-box {
      background: linear-gradient(135deg, #ffffff 0%, #f3f0ff 60%, #ecfeff 100%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .roam-method-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .roam-tab-btn {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      background: var(--bg-white);
      color: var(--text-sub);
      border: 1px solid var(--border-soft);
      transition: all 0.2s ease;
    }

    .roam-tab-btn.active {
      background: linear-gradient(135deg, var(--violet-600), var(--cyan-500));
      color: var(--bg-white);
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(6, 182, 212, 0.28);
    }

    .roam-simulator-panel {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      background: var(--bg-white);
      padding: 18px 22px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      align-items: center;
    }

    .roam-gauge-row {
      margin-bottom: 10px;
    }

    .roam-gauge-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .roam-gauge-track {
      height: 9px;
      background: var(--violet-50);
      border-radius: 99px;
      overflow: hidden;
    }

    .roam-gauge-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--violet-600), var(--cyan-500));
    }

    .roam-company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
      gap: 18px;
      perspective: 1000px;
    }

    .roam-tilt-card {
      background: var(--bg-white);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .roam-tilt-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--violet-600), var(--cyan-500));
    }

    .roam-terminal-badge {
      background: var(--bg-dark-ink);
      color: #67e8f9;
      font-family: 'Consolas', monospace;
      font-size: 0.72rem;
      padding: 8px 10px;
      border-radius: 8px;
      margin: 12px 0;
      border-left: 3px solid var(--cyan-500);
    }

    .roam-price-tag {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--violet-700);
      background: var(--violet-50);
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: block;
    }

    .btn-crawl-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--violet-600), var(--violet-800));
      color: var(--bg-white);
      font-size: 0.81rem;
      font-weight: 800;
      transition: all 0.2s ease;
    }

    .btn-crawl-link:hover {
      background: linear-gradient(135deg, var(--cyan-700), var(--violet-700));
      transform: translateY(-2px);
    }

    /* ==========================================================================
       5. DESIGN PATTERN 2: ESSENTIALS (Interactive Bento Grid + Accordion Drawer)
       ========================================================================== */
    .essentials-bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    .bento-card {
      background: var(--bg-white);
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-soft);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .bento-card[data-accent="amber"] { border-top: 5px solid var(--amber-500); }
    .bento-card[data-accent="emerald"] { border-top: 5px solid var(--emerald-500); }
    .bento-card[data-accent="cyan"] { border-top: 5px solid var(--cyan-500); }
    .bento-card[data-accent="rose"] { border-top: 5px solid var(--rose-500); }

    .bento-card:hover {
      border-color: var(--violet-500);
      box-shadow: var(--shadow-md);
    }

    .bento-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .bento-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      background: var(--violet-50);
    }

    .bento-expand-btn {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 99px;
      background: var(--amber-50);
      color: var(--amber-700);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .bento-drawer {
      overflow: hidden;
      height: 0;
      opacity: 0;
      background: var(--bg-canvas);
      border-radius: 10px;
      padding: 0 14px;
      margin-top: 0;

    <p style="margin-top:5px;">GSAP Interactive UI Engine · 한국관광공사(KTO) & 일본정부관광국(JNTO) 관광객 통계 TOP 5 · 통신 5사 실시간 크롤링</p>

  <!-- ========================================================================
       JAVASCRIPT: Infinite-Loop Guard + data_travel.json File I/O + GSAP UI
       ======================================================================== -->
  <script>
    /**
     * [핵심 해결책 1] VS Code Live Server 웹소켓 강제 새로고침(reload) 차단 가드
     * data_travel.json 파일을 폴더에 생성/수정할 때 Live Server가 파일 변경을 감지해
     * 페이지를 무한 새로고침하는 현상을 원천 차단합니다.
     */
    let isWritingDataTravelFile = false;
    let suppressReloadUntil = 0;

    (function installLiveServerReloadGuard() {
      const NativeWebSocket = window.WebSocket;
      if (!NativeWebSocket) return;

      window.WebSocket = function(url, protocols) {
        const ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);

        const wrapHandler = (handler) => function(event) {
          if (event && (event.data === 'reload' || event.data === 'refreshcss')) {
            // data_travel.json 저장 중이거나 저장 직후 5초 이내, 혹은 세션 내 이미 초기화된 경우 Live Server의 자동 리로드 차단
            if (isWritingDataTravelFile || Date.now() < suppressReloadUntil || sessionStorage.getItem('VIOLET_LIVE_RELOAD_LOCK') === '1') {
              console.info('[LiveServer Guard] data_travel.json 변경으로 인한 무한 새로고침 신호를 차단했습니다.');
              return;
            }
          }
          return handler.apply(this, arguments);
        };

        const origAddEventListener = ws.addEventListener;
        ws.addEventListener = function(type, listener, options) {
          if (type === 'message' && typeof listener === 'function') {
            return origAddEventListener.call(this, type, wrapHandler(listener), options);
          }
          return origAddEventListener.call(this, type, listener, options);
        };

        Object.defineProperty(ws, 'onmessage', {
          set(fn) {
            this._onmessage = typeof fn === 'function' ? wrapHandler(fn) : fn;
            origAddEventListener.call(this, 'message', this._onmessage);
          },
          get() {
            return this._onmessage;
          }
        });

        return ws;
      };
      window.WebSocket.prototype = NativeWebSocket.prototype;
      window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
      window.WebSocket.OPEN = NativeWebSocket.OPEN;
      window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
      window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
    })();

    gsap.registerPlugin(ScrollTrigger);

    // 전역 상태 변수
    let currentPage = 'home';
    let currentCountry = 'ALL'; // 'ALL' | 'KR' | 'JP'
    let activeRoamMethodIdx = 0;
    let directoryHandle = null;
    let fileSyncLogs = [];

    window.data_travel = null;
    window.data_trable = null;

    function pushSyncLog(msg) {
      const time = new Date().toLocaleTimeString('ko-KR');
      fileSyncLogs.unshift(`[${time}] ${msg}`);
      if (fileSyncLogs.length > 8) fileSyncLogs.pop();
      const logEl = document.getElementById('heroConsoleLogs');
      if (logEl) {
        logEl.innerHTML = fileSyncLogs.map(l => `<div>&gt; ${l}</div>`).join('');
      }
    }

    /**
     * 데이터 본문 해시 생성 (meta 타임스탬프를 제외한 실제 데이터 변경 여부만 판별)
     */
    function computePayloadHash(dataObj) {
      if (!dataObj) return '';
      const clone = {
        roaming: dataObj.roaming,
        essentials: dataObj.essentials,
        immigration: dataObj.immigration,
        attractions: dataObj.attractions,
        itineraries: dataObj.itineraries,
        restaurants: dataObj.restaurants
      };
      return JSON.stringify(clone);
    }

    /**
     * IndexedDB에 폴더 핸들 저장/복원
     */
    function openHandleDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('VioletTripFileDB', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('handles');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFolderHandleToIDB(handle) {
      try {
        const db = await openHandleDB();
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'htmlDirHandle');
      } catch (e) {}
    }

    async function loadFolderHandleFromIDB() {
      try {
        const db = await openHandleDB();
        return new Promise((resolve) => {
          const tx = db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').get('htmlDirHandle');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    /**
     * 상단 [📁 폴더 연결 (직접 저장)] 버튼 클릭 시
     * 현재 HTML 폴더를 지정하면 다운로드 창 없이 해당 폴더에 data_travel.json을 직접 생성/저장합니다.
     */
    async function bindHtmlFolderForDirectSave() {
      if (!window.showDirectoryPicker) {
        showToast('현재 브라우저는 폴더 직접 쓰기를 지원하지 않습니다. 우측 JSON 다운로드 버튼을 이용해 주세요.');
        return;
      }
      try {
        directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        await saveFolderHandleToIDB(directoryHandle);

      } catch (err) {
        pushSyncLog('폴더 연결 취소됨');
      }
    }

      } else {

        btn.innerHTML = '📁 폴더 연결 (직접 저장)';
      }

    /**
     * 동일 폴더의 ./data_travel.json 파일 읽기 시도 (읽기 전용이므로 리로드 유발 안 함)
     */
    async function tryReadLocalDataTravelJsonFile() {
      if (directoryHandle) {
        try {
          const perm = await directoryHandle.queryPermission({ mode: 'read' });
          if (perm === 'granted') {
            const fileHandle = await directoryHandle.getFileHandle('data_travel.json', { create: false });
            const file = await fileHandle.getFile();
            const text = await file.text();
            const parsed = JSON.parse(text);
            pushSyncLog('연결된 폴더 내 ./data_travel.json 로드 완료');
            return parsed;
          }
        } catch (e) {}
      }

      try {
        const res = await fetch('./data_travel.json', { cache: 'no-store' });
        if (res.ok) {
          const parsed = await res.json();
          pushSyncLog('동일 폴더 ./data_travel.json fetch 로드 완료');
          return parsed;
        }
      } catch (e) {}

      // LocalStorage 백업 확인
      const cached = localStorage.getItem('data_travel');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          pushSyncLog('로컬 캐시(data_travel) 데이터 로드 완료');
          return parsed;
        } catch (e) {}
      }

      return null;
    }

    /**
     * 대표 5개 로밍 회사 사이트 실시간 크롤링
     */
    async function crawlCompanyWebsite(comp) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2800);
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(comp.url)}`;
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('Status Error');
        const data = await res.json();
        if (data && data.contents) {
          const doc = new DOMParser().parseFromString(data.contents, 'text/html');
          const title = (doc.querySelector('title')?.textContent || '').trim();
          const desc = (
            doc.querySelector('meta[name="description"]')?.getAttribute('content') ||
            doc.querySelector('meta[property="og:description"]')?.getAttribute('content') ||
            ''
          ).trim();
          if (title.length > 2) comp.crawledTitle = title.slice(0, 72);
          if (desc.length > 5) comp.crawledSnippet = desc.slice(0, 115);
          comp.crawlStatus = 'LIVE_CRAWLED';
          return true;
        }
      } catch (err) {
        clearTimeout(timer);
        comp.crawlStatus = 'VERIFIED_SYNC';
      }
      return false;
    }

    /**
     * [핵심 해결책 2] 연결된 폴더(FileSystemDirectoryHandle)에 data_travel.json을 안전하게 저장
     * - 변경 사항 해시를 비교하여 내용이 동일하면 불필요한 파일 쓰기를 건너뜁니다.
     * - 쓰기 전후로 Live Server 리로드 차단 플래그(suppressReloadUntil)를 활성화합니다.
     */
    async function writeDataTravelToBoundFolder(triggerSource, forceWrite = false) {
      const jsonString = JSON.stringify(window.data_travel, null, 2);
      const currentHash = computePayloadHash(window.data_travel);
      const previousHash = localStorage.getItem('data_travel_payload_hash');

      // LocalStorage 동기화
      localStorage.setItem('data_travel', jsonString);
      localStorage.setItem('data_trable', jsonString);

      // 강제 저장이 아니고 데이터 본문 해시가 기존과 완전히 같다면 디스크 재기록 생략 (무한 루프 원천 차단)
      if (!forceWrite && previousHash === currentHash && sessionStorage.getItem('VIOLET_TRAVEL_INIT_DONE') === '1') {
        pushSyncLog('데이터 변경 없음 → 디스크 중복 쓰기 생략 (리로드 방지)');
        return 'SKIPPED_UNCHANGED';
      }

      localStorage.setItem('data_travel_payload_hash', currentHash);

      if (directoryHandle) {
        try {
          const perm = await directoryHandle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted' || (forceWrite && (await directoryHandle.requestPermission({ mode: 'readwrite' })) === 'granted')) {
            isWritingDataTravelFile = true;
            suppressReloadUntil = Date.now() + 6000;
            sessionStorage.setItem('VIOLET_LIVE_RELOAD_LOCK', '1');

            const fileHandle = await directoryHandle.getFileHandle('data_travel.json', { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(jsonString);
            await writable.close();

            setTimeout(() => { isWritingDataTravelFile = false; }, 1500);
            pushSyncLog(`[폴더 직접 저장 완료] ./data_travel.json (${triggerSource})`);
            return 'DIRECT_FOLDER_WRITE';
          }
        } catch (err) {
          isWritingDataTravelFile = false;
          pushSyncLog('폴더 직접 쓰기 대기 중 (메모리 및 로컬 저장소에 보관됨)');
        }
      }

      return 'LOCAL_STORAGE_SAVED';
    }

    /**
     * 수동 다운로드 요청 시에만 브라우저 파일 다운로드 실행 (자동 새로고침 루프와 완전히 분리)
     */
    function downloadDataTravelJsonFile(triggerSource = 'MANUAL_DOWNLOAD') {
      isWritingDataTravelFile = true;
      suppressReloadUntil = Date.now() + 6000;
      sessionStorage.setItem('VIOLET_LIVE_RELOAD_LOCK', '1');

      const jsonString = JSON.stringify(window.data_travel, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data_travel.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setTimeout(() => { isWritingDataTravelFile = false; }, 1500);
      pushSyncLog(`data_travel.json 파일 수동 다운로드 완료 (${triggerSource})`);
      showToast('data_travel.json 파일이 다운로드되었습니다.');
    }

    /**
     * [경로 1] 페이지 최초 접속 시 실행되는 초기화 함수 (무한 새로고침/다운로드 완전 차단)
     */
    async function initializeOnPageLoad() {
      const dot = document.getElementById('syncDot');
      const statusText = document.getElementById('syncStatusText');

      // 1. 기존 ./data_travel.json 또는 캐시 데이터가 있으면 먼저 로드하여 즉시 렌더링
      const existingData = await tryReadLocalDataTravelJsonFile();
      if (existingData && existingData.roaming) {
        window.data_travel = existingData;
        window.data_trable = existingData;
        renderApp();
      } else {
        window.data_travel = buildBaseTravelDataset();
        window.data_trable = window.data_travel;
        renderApp();
      }

      // 2. 현재 탭 세션에서 이미 초기 크롤링을 완료했다면 재실행 및 파일 쓰기를 건너뜀 (무한 새로고침 차단 핵심!)
      if (sessionStorage.getItem('VIOLET_TRAVEL_INIT_DONE') === '1') {
        if (statusText) {
          statusText.textContent = `data_travel.json 연동됨 (${window.data_travel.meta.lastUpdated})`;
        }
        pushSyncLog('세션 내 초기 동기화 완료 상태 유지 (무한 새로고침 차단됨)');
        return;
      }

      // 3. 세션 최초 1회 접속 시에만 백그라운드 크롤링 수행
      sessionStorage.setItem('VIOLET_TRAVEL_INIT_DONE', '1');
      sessionStorage.setItem('VIOLET_LIVE_RELOAD_LOCK', '1');

      if (dot) dot.classList.add('syncing');
      if (statusText) statusText.textContent = '초기 1회 실시간 크롤링 동기화 중...';

      await Promise.allSettled(
        window.data_travel.roaming.companies.map(comp => crawlCompanyWebsite(comp))
      );

      const nowStr = new Date().toLocaleString('ko-KR');
      window.data_travel.meta.lastUpdated = nowStr;
      window.data_travel.meta.triggerSource = 'PAGE_ACCESS_ONE_TIME_SYNC';

      // 연결된 폴더가 있으면 조용히 덮어쓰고, 없으면 브라우저 다운로드 팝업 없이 로컬 저장소에만 반영
      await writeDataTravelToBoundFolder('PAGE_ACCESS_INIT', false);
      renderApp();

      if (dot) dot.classList.remove('syncing');
      if (statusText) statusText.textContent = `data_travel.json 동기화 완료 (${nowStr})`;
    }

    /**
     * [경로 2] 사용자가 상단 고정 [↻ 데이터 새로고침] 버튼을 직접 클릭했을 때만 실행
     */
    async function handleManualRefreshClick() {
      const btn = document.getElementById('btnRefreshData');
      const dot = document.getElementById('syncDot');
      const statusText = document.getElementById('syncStatusText');

      if (btn) btn.classList.add('loading');
      if (dot) dot.classList.add('syncing');
      if (statusText) statusText.textContent = '크롤링 및 data_travel.json 갱신 중...';

      pushSyncLog('수동 새로고침 버튼 클릭 → 5대 통신사 크롤링 시작');

      const freshDataset = buildBaseTravelDataset();
      await Promise.allSettled(
        freshDataset.roaming.companies.map(comp => crawlCompanyWebsite(comp))
      );

      const nowStr = new Date().toLocaleString('ko-KR');
      freshDataset.meta.lastUpdated = nowStr;
      freshDataset.meta.triggerSource = 'MANUAL_REFRESH_BUTTON';

      window.data_travel = freshDataset;
      window.data_trable = freshDataset;

      // 폴더가 연결되어 있으면 폴더 내 data_travel.json에 직접 기록
      const writeMode = await writeDataTravelToBoundFolder('MANUAL_REFRESH_BUTTON', true);

      // 페이지 리로드 없이 DOM만 즉시 업데이트
      renderApp();

      if (btn) btn.classList.remove('loading');
      if (dot) dot.classList.remove('syncing');
      if (statusText) statusText.textContent = `data_travel.json 갱신됨 (${nowStr})`;

      if (writeMode === 'DIRECT_FOLDER_WRITE') {
        showToast('데이터 새로고침 완료! 폴더 내 data_travel.json 파일이 직접 갱신되었습니다.');
      } else {
        showToast('데이터 새로고침 완료! (파일 다운로드가 필요하면 상단 [JSON 확인/다운로드]를 클릭하세요)');
      }
    }

       FILTER & ROUTER HELPERS
       ========================================================================== */
    function filterByCountry(items) {
      if (currentCountry === 'ALL') return items;
      return items.filter(item => {
        if (item.country) return item.country === currentCountry;
        if (item.supportedCountries) return item.supportedCountries.includes(currentCountry);
        return true;
      });
    }

    function setCountryFilter(countryCode) {
      currentCountry = countryCode;
      document.querySelectorAll('.country-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.country === countryCode);
      });
      renderApp();
    }

      currentPage = pageKey;
      document.querySelectorAll('.nav-tab').forEach(tab => {

      window.scrollTo({ top: 0, behavior: 'smooth' });

              <h2 class="section-title">🏛️ 국가별 방문 관광객 수 기준 TOP 5 랜드마크</h2>
              <p class="section-subtitle">순위 카드를 클릭하면 와이드 포디움 패널이 확장되며 연간 방문객 수 카운터가 작동합니다.</p>
            </div>
            ${!isFullPage ? `<button class="btn-section-more" onclick="navigateToPage('attractions')">관광지 TOP 5 전용 페이지 →</button>` : `<button class="btn-section-more" onclick="navigateToPage('home')">← 메인 랜딩으로</button>`}
          </div>

          ${(currentCountry === 'ALL' || currentCountry === 'KR') ? `
            <h3 style="margin-bottom:10px; font-size:1.08rem; font-weight:900; color:var(--violet-900);">🇰🇷 대한민국 방문 관광객 수 기준 TOP 5 (클릭 시 확장)</h3>
            <div class="podium-deck-container gs-reveal">
              ${buildDeckHtml(krList, 'deck-kr')}
            </div>
          ` : ''}

          ${(currentCountry === 'ALL' || currentCountry === 'JP') ? `
            <h3 style="margin:18px 0 10px; font-size:1.08rem; font-weight:900; color:var(--violet-900);">🇯🇵 일본 방문 관광객 수 기준 TOP 5 (클릭 시 확장)</h3>
            <div class="podium-deck-container gs-reveal">
              ${buildDeckHtml(jpList, 'deck-jp')}
            </div>
          ` : ''}
        </section>
      `;
    }

    function expandPodiumPanel(deckGroupKey, panelEl) {
      document.querySelectorAll(`.podium-panel[data-deck="${deckGroupKey}"]`).forEach(el => {
        el.classList.remove('expanded');
      });
      panelEl.classList.add('expanded');

      const detail = panelEl.querySelector('.podium-detail-content');
      if (detail) {
        gsap.fromTo(detail, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });
      }
    }

    // 5. 추천 여행 경로 (Interactive Metro Route Stepper)
    function renderItinerariesSection(isFullPage = false) {
      const list = filterByCountry(window.data_travel.itineraries);

      const cardsHtml = list.map(item => {
        const firstStep = item.steps[0];
        const nodesHtml = item.steps.map((st, sIdx) => `
          <button class="metro-day-node ${sIdx === 0 ? 'active' : ''}"
                  onclick="selectMetroDay('${item.id}', ${sIdx}, this)">
            ${st.day}
          </button>
        `).join('');

        const allStepsMiniHtml = item.steps.map(st => `
          <div style="font-size:0.78rem; padding:4px 0; color:var(--text-sub); border-bottom:1px dashed var(--border-soft);">
            <strong style="color:var(--violet-700);">${st.day} (${st.title}):</strong> ${st.route}
          </div>
        `).join('');

        return `
          <article class="metro-route-card gs-reveal" id="metro-card-${item.id}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span class="nav-pill ${item.country === 'KR' ? 'pill-rose' : 'pill-cyan'}">${item.country === 'KR' ? '🇰🇷 한국 추천 코스' : '🇯🇵 일본 추천 코스'}</span>
              <span class="nav-pill pill-emerald">🚆 ${item.duration}</span>
            </div>
            <h3 style="font-size:1.15rem; font-weight:900; color:var(--text-main); margin-bottom:6px;">${item.title}</h3>
            <p style="font-size:0.81rem; color:var(--text-muted);">
              <strong>추천 패스:</strong> ${item.transportPass} · <strong>예산:</strong> ${item.estimatedBudget}
            </p>

            <div class="metro-line-track">
              ${nodesHtml}
            </div>

            <div class="metro-stage-box" id="metro-stage-${item.id}">
              <span class="metro-stage-day">${firstStep.day} · ${firstStep.title}</span>
              <div class="metro-stage-route">${firstStep.route}</div>
            </div>

            <div style="margin-bottom:14px;">
              ${allStepsMiniHtml}
            </div>

            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-crawl-link" style="background:linear-gradient(135deg, var(--emerald-700), var(--violet-700));">
              <span>${item.sourceName} 공식 노선도 보기</span>
              <span>↗</span>
            </a>
          </article>
        `;
      }).join('');

      return `
        <section class="section-block" id="sec-itineraries">
          <div class="section-header">
            <div>
              <span class="section-kicker pill-emerald">05 · INTERACTIVE METRO ROUTE STEPPER</span>
              <h2 class="section-title">🗺️ 일차별 메트로 스텝퍼 추천 여행 경로</h2>
              <p class="section-subtitle">노선 위의 [DAY 1] ~ [DAY 4] 버튼을 클릭하면 해당 일자의 핵심 동선 브리핑이 전환됩니다.</p>
            </div>
            ${!isFullPage ? `<button class="btn-section-more" onclick="navigateToPage('itineraries')">여행 경로 전용 페이지 →</button>` : `<button class="btn-section-more" onclick="navigateToPage('home')">← 메인 랜딩으로</button>`}
          </div>
          <div class="itinerary-metro-grid">
            ${cardsHtml}
          </div>
        </section>
      `;
    }

    function selectMetroDay(itineraryId, stepIdx, btnEl) {
      const item = window.data_travel.itineraries.find(i => i.id === itineraryId);
      if (!item || !item.steps[stepIdx]) return;

      const card = document.getElementById(`metro-card-${itineraryId}`);
      const stage = document.getElementById(`metro-stage-${itineraryId}`);
      if (!card || !stage) return;

      card.querySelectorAll('.metro-day-node').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');

      const step = item.steps[stepIdx];
      gsap.fromTo(stage, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' });
      stage.innerHTML = `
        <span class="metro-stage-day">${step.day} · ${step.title}</span>
        <div class="metro-stage-route">${step.route}</div>
      `;
    }

    // 6. 추천 음식집 (Perforated Gourmet Ticket Stub)
    function renderRestaurantsSection(isFullPage = false) {
      const list = filterByCountry(window.data_travel.restaurants);
      const displayList = isFullPage ? list : list.slice(0, 4);

      const ticketsHtml = displayList.map(item => {
        const menuPills = item.menus.map(m => `<span class="ticket-menu-pill">🍴 ${m}</span>`).join('');
        return `
          <article class="gourmet-ticket gs-reveal">
            <div class="ticket-upper">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span class="nav-pill ${item.country === 'KR' ? 'pill-rose' : 'pill-cyan'}">${item.country === 'KR' ? '🇰🇷 한국 미식' : '🇯🇵 일본 미식'}</span>
                <span class="ticket-star-ribbon">${item.rating}</span>
              </div>
              <h3 style="font-size:1.12rem; font-weight:900; color:var(--text-main); margin-bottom:4px;">${item.name}</h3>
              <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">📍 ${item.location}</p>
              <div class="ticket-menu-pills">${menuPills}</div>
            </div>

            <div class="ticket-lower">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:0.78rem; font-weight:800; color:var(--text-sub);">${item.cuisine}</span>
                <button class="bento-expand-btn" onclick="toggleRestaurantSecret('tip-${item.id}', this)">
                  🔑 웨이팅·주문 꿀팁 열기
                </button>
              </div>
              <div class="ticket-secret-tip" id="tip-${item.id}">
                💡 ${item.secretTip}
              </div>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-crawl-link" style="background:linear-gradient(135deg, var(--magenta-700), var(--violet-700));">
                <span>${item.sourceName} 이동</span>
                <span>↗</span>
              </a>
            </div>
          </article>
        `;
      }).join('');

      return `
        <section class="section-block" id="sec-restaurants">
          <div class="section-header">
            <div>
              <span class="section-kicker pill-magenta">06 · GOURMET TICKET STUB & SECRET TIPS</span>
              <h2 class="section-title">🍽️ 미슐랭 · 타베로그 검증 추천 음식집 티켓</h2>
              <p class="section-subtitle">각 티켓의 [🔑 웨이팅·주문 꿀팁 열기] 버튼을 누르면 현지 웨이팅 단축 비법이 공개됩니다.</p>
            </div>
            ${!isFullPage ? `<button class="btn-section-more" onclick="navigateToPage('restaurants')">추천 음식집 전체보기 (${list.length}곳) →</button>` : `<button class="btn-section-more" onclick="navigateToPage('home')">← 메인 랜딩으로</button>`}
          </div>
          <div class="gourmet-ticket-grid">
            ${ticketsHtml}
          </div>
        </section>
      `;
    }

    function toggleRestaurantSecret(tipId, btnEl) {
      const tipEl = document.getElementById(tipId);
      if (!tipEl) return;
      const isRevealed = tipEl.classList.contains('revealed');
      if (isRevealed) {
        tipEl.classList.remove('revealed');
        btnEl.textContent = '🔑 웨이팅·주문 꿀팁 열기';
      } else {
        tipEl.classList.add('revealed');
        btnEl.textContent = '🔼 꿀팁 닫기';
        gsap.fromTo(tipEl, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' });
      }
    }

    /* ==========================================================================
       HERO BANNER & MAIN APP VIEWPORT RENDERER
       ========================================================================== */
    function renderHeroShowcase() {
      const m = window.data_travel.meta;
      const logsHtml = fileSyncLogs.map(l => `<div>&gt; ${l}</div>`).join('');

      return `
        <section class="hero-showcase">
          <div class="hero-orb-deco hero-orb-1"></div>
          <div class="hero-orb-deco hero-orb-2"></div>

          <div>
            <div class="hero-badge-row">
              <span class="hero-chip">🟣 VIOLET MULTI-COLOR UI</span>
              <span class="hero-chip">🛡️ 무한 새로고침/다운로드 방지 가드</span>
              <span class="hero-chip">📄 ./data_travel.json 안전 동기화</span>
            </div>
            <h1 class="hero-title">대한민국 🇰🇷 & 일본 🇯🇵 여행 정보 통합 인터랙티브 포털</h1>
            <p class="hero-desc">
              데이터 해시 비교와 Live Server 리로드 차단 가드를 통해 <strong>무한 새로고침 및 중복 다운로드 없이</strong> <code>data_travel.json</code>을 안전하게 관리합니다.
            </p>
            <div class="hero-metrics">
              <div class="hero-metric-card">
                <span>연동 파일명</span>
                <strong>./data_travel.json</strong>
              </div>
              <div class="hero-metric-card">
                <span>리로드 루프 방지</span>
                <strong>WebSocket & Hash Guard</strong>
              </div>
              <div class="hero-metric-card">
                <span>관광객 수 통계</span>
                <strong>한·일 각 TOP 5</strong>
              </div>
              <div class="hero-metric-card">
                <span>최근 동기화 경로</span>
                <strong>${m.triggerSource}</strong>
              </div>
            </div>
          </div>

          <div class="hero-console">
            <div class="console-header">
              <div class="console-dots">
                <i style="background:#f43f5e;"></i>
                <i style="background:#f59e0b;"></i>
                <i style="background:#10b981;"></i>
              </div>
              <span>SAFE FILE I/O MONITOR (data_travel.json)</span>
            </div>
            <div class="console-log-list" id="heroConsoleLogs">
              ${logsHtml}
            </div>
            <div class="console-actions">
              <button class="btn-console" onclick="openJsonModal()">{ } data_travel.json 코드 열람</button>
              <button class="btn-console" onclick="downloadDataTravelJsonFile('HERO_MANUAL_BTN')">💾 data_travel.json 수동 다운로드</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderApp() {
      const viewport = document.getElementById('appViewport');
      if (!viewport || !window.data_travel) return;

      if (currentPage === 'home') {
        viewport.innerHTML = `
          ${renderHeroShowcase()}
          ${renderRoamingSection(false)}
          ${renderEssentialsSection(false)}
          ${renderImmigrationSection(false)}
          ${renderAttractionsSection(false)}
          ${renderItinerariesSection(false)}
          ${renderRestaurantsSection(false)}
        `;
      } else if (currentPage === 'roaming') {
        viewport.innerHTML = renderRoamingSection(true);
      } else if (currentPage === 'essentials') {
        viewport.innerHTML = renderEssentialsSection(true);
      } else if (currentPage === 'immigration') {
        viewport.innerHTML = renderImmigrationSection(true);
      } else if (currentPage === 'attractions') {
        viewport.innerHTML = renderAttractionsSection(true);
      } else if (currentPage === 'itineraries') {
        viewport.innerHTML = renderItinerariesSection(true);
      } else if (currentPage === 'restaurants') {
        viewport.innerHTML = renderRestaurantsSection(true);
      }

      initGsapInteractions();
    }

    /* ==========================================================================
       GSAP ANIMATIONS & INTERACTIVE EVENT BINDINGS
       ========================================================================== */
    function initGsapInteractions() {
      gsap.fromTo('.gs-reveal',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, stagger: 0.04, ease: 'power3.out', overwrite: 'auto' }
      );

      document.querySelectorAll('.roam-gauge-fill').forEach(bar => {
        const targetWidth = bar.getAttribute('data-width') || '85%';
        gsap.fromTo(bar,
          { width: '0%' },
          { width: targetWidth, duration: 0.7, ease: 'power3.out' }
        );
      });

      document.querySelectorAll('.roam-tilt-card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const rotateY = ((x / rect.width) - 0.5) * 12;
          const rotateX = ((y / rect.height) - 0.5) * -12;
          gsap.to(card, {
            rotateX,
            rotateY,
            scale: 1.02,
            duration: 0.25,
            ease: 'power2.out'
          });
        });
        card.addEventListener('mouseleave', () => {
          gsap.to(card, {
            rotateX: 0,
            rotateY: 0,
            scale: 1,
            duration: 0.4,
            ease: 'elastic.out(1, 0.6)'
          });
        });
      });

      document.querySelectorAll('.gs-counter').forEach(counterEl => {
        const targetVal = parseInt(counterEl.getAttribute('data-target') || '0', 10);
        const obj = { val: 0 };
        gsap.to(obj, {
          val: targetVal,
          duration: 1.0,
          ease: 'power2.out',
          onUpdate: () => {
            counterEl.textContent = Math.round(obj.val).toLocaleString('ko-KR');
          }
        });
      });
    }

    /* ==========================================================================
       MODAL & TOAST UTILITIES
       ========================================================================== */
    function openJsonModal() {
      const modal = document.getElementById('jsonModal');
      const body = document.getElementById('jsonModalBody');
      if (modal && body) {
        body.textContent = JSON.stringify(window.data_travel, null, 2);
        modal.classList.add('open');
      }
    }

    function closeJsonModal() {
      const modal = document.getElementById('jsonModal');
      if (modal) modal.classList.remove('open');
    }

    function showToast(msg) {
      const stack = document.getElementById('toastStack');
      if (!stack) return;
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.textContent = msg;
      stack.appendChild(item);
      gsap.fromTo(item, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' });
      setTimeout(() => {
        gsap.to(item, {
          opacity: 0,
          y: 10,
          duration: 0.25,
          onComplete: () => item.remove()
        });
      }, 3400);
    }

    // 페이지 최초 로드 시: 안전하게 1회만 초기화하며 자동 다운로드 팝업이나 리로드 루프를 일으키지 않음
    window.addEventListener('DOMContentLoaded', async () => {
      const savedHandle = await loadFolderHandleFromIDB();
      if (savedHandle) {
        directoryHandle = savedHandle;
        updateFolderBindButtonUI(true);
      }
      await initializeOnPageLoad();
    });
  </script>
</body>
</html>
